name: Build MoonlightNaCl.wgt

# Every push to main/master (or manual run) builds the .wgt and uploads it as an artifact.
# If the version in config.xml has no release yet, a GitHub Release (tag vX.Y.Z) is
# created automatically with the .wgt attached. To publish a new release, raise the
# version in config.xml.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the source
        uses: actions/checkout@v4

      # The Dockerfile downloads Tizen Studio and the Samsung NaCl SDK, compiles
      # the app and packages/signs the .wgt.
      - name: Build (Dockerfile)
        run: docker build -t moonlight-nacl-plus .

      - name: Extract the .wgt from the image
        run: |
          mkdir -p out
          docker create --name mlx moonlight-nacl-plus
          docker cp mlx:/home/moonlight/MoonlightNaCl.wgt out/MoonlightNaCl.wgt
          docker rm mlx
          ls -l out

      - name: Upload the .wgt
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightNaCl-wgt
          path: out/MoonlightNaCl.wgt
          if-no-files-found: error

      - name: Publish the release (if this version has none yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -o 'version="[0-9.]*"' config.xml | head -1 | cut -d'"' -f2)
          tag="v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi
          cp out/MoonlightNaCl.wgt "out/MoonlightNaCl-$tag.wgt"
          gh release create "$tag" "out/MoonlightNaCl-$tag.wgt" \
            --target "$GITHUB_SHA" \
            --title "Moonlight NaCl Plus $tag" \
            --notes-file RELEASE_NOTES.md
